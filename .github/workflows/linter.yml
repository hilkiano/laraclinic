name: Code Style Lint

on:
  pull_request:
    branches: [master]

jobs:
  codestyle:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          tools: phpcs:4.0.4

      - name: Show PHPCS version
        run: phpcs --version

      - name: Run CodeSniffer
        run: phpcs --standard=PSR12 -s app routes config database tests
